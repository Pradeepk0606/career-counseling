[project]
name = "career-counseling"
version = "0.1.0"
description = "Career Compass Web Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "coverage==7.4.4",
    "crispy-bootstrap5==2024.2",
    "Django==5.0.4",
    "Faker==24.9.0",
    "python-decouple==3.8",
    "pre-commit==3.7.0",
    "whitenoise>=6.6.0",
    "gunicorn>=21.2.0",
    "dj-database-url>=2.1.0",
    "psycopg2-binary>=2.9.9",
]

[tool.black]
line-length = 119
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
  )/
'''

[tool.ruff]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
]

ignore = ["E501"]
unfixable = ["B"]
extend-exclude = ["migrations", "manage.py"]

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.flake8-quotes]
docstring-quotes = "double"
